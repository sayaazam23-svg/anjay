<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HALLOWEEN ANJAY</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:monospace;display:flex;align-items:center;justify-content:center;height:100vh;overflow:hidden}
#box{text-align:center}
h1{font-size:50px;animation:flicker 0.2s infinite}
@keyframes flicker{0%{opacity:1}50%{opacity:.2}100%{opacity:1}}
button{padding:15px 30px;font-size:20px;background:red;border:none;color:#fff;cursor:pointer;border-radius:10px}
#jumpscare{display:none;position:fixed;inset:0;background:#000;z-index:99}
#jumpscare img{width:100%;height:100%;object-fit:cover}
</style>
</head>
<body>
<div id="box">
<h1>🎃 JANGAN KLIK 🎃</h1>
<p>kalau berani...</p>
<button onclick="scare()">KLIK DI SINI</button>
</div>
<div id="jumpscare">
<img src="https://i.gifer.com/origin/7a/7a9d9e5c2e2e7b8f8c9d0e1f2a3b4c5d6.gif">
<audio id="scream" src="https://www.myinstants.com/media/sounds/scream.mp3" autoplay></audio>
</div>
<script>
function scare(){
 document.getElementById('box').style.display='none';
 document.getElementById('jumpscare').style.display='block';
 document.getElementById('scream').play();
 setTimeout(()=>{alert('ANJAY KENA PRANK HALLOWEEN! wkwk')},800)
}
</script>
</body>
</html>
